<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 128" width="512" height="128">
  <defs>
    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 52px;
        font-weight: 300;
        fill: #FFFFFF;
        letter-spacing: 1px;
      }
      .brand-os {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: #5EB4FF;
        letter-spacing: 2px;
      }
      .brand-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #8E9BAE;
        letter-spacing: 6px;
      }
    </style>
  </defs>

  <!-- Globus Cruciger Emblem (Option 1) -->
  <g transform="translate(-10, -10) scale(0.58)" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="150" r="60"/>
    <line x1="68" y1="150" x2="188" y2="150"/>
    <line x1="128" y1="210" x2="128" y2="30"/>
    <line x1="104" y1="52" x2="152" y2="52"/>
  </g>

  <!-- Typography -->
  <text x="140" y="74">
    <tspan class="brand-title">kilise</tspan>
    <tspan class="brand-os">OS</tspan>
  </text>
  <text x="142" y="102" class="brand-sub">OPERATING SYSTEM</text>
</svg>
